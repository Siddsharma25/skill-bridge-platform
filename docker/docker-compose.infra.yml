# Local dev infrastructure, introduced incrementally per phase rather than
# all at once (see docs/DECISIONS.md and the Phased Rollout in the
# architecture plan):
#
#   - Redis:              here from Phase 1a onward.
#   - Kafka:               here from Phase 2 onward (this file) — the real
#                          event flow: users-service publishes
#                          `user.skills.updated`, skills-service publishes
#                          `skill.updated`, jobs-service publishes
#                          `job.posted`/`job.matched` and consumes all
#                          three into its own projection/matching-worker/
#                          cache-invalidation consumers. See
#                          docs/DECISIONS.md's "Phase 2 implementation
#                          notes" for why the official `apache/kafka` image
#                          in KRaft mode (no Zookeeper) was chosen over a
#                          Bitnami image — this project avoids Bitnami
#                          entirely (see the existing Kafka-on-k8s warning
#                          below), not just for Helm charts specifically.
#   - RabbitMQ:            here from Phase 3 onward (this file) —
#                          auth-service publishes `notifications.email` on
#                          successful Register; notification-service (the
#                          NestJS service, backend/notification-service/)
#                          consumes it, with a dead-letter exchange
#                          (`notifications.dlx` -> `notifications.email.dlq`)
#                          so a malformed/unprocessable message lands
#                          somewhere inspectable instead of looping or
#                          vanishing. See internal/platform/rabbitmq and
#                          docs/DECISIONS.md's "Phase 3 implementation
#                          notes" for the topology/ownership reasoning.
#                          As of Phase 3.5, auth-service and jobs-service
#                          also publish to `notifications.realtime`
#                          (deliberately no DLQ — see topology.go),
#                          consumed only by api-gateway's own in-process
#                          bridge (internal/gateway/realtime), which
#                          republishes onto this same Redis instance's
#                          pub/sub for any live `onNotification` GraphQL
#                          subscription — see docs/DECISIONS.md's "Phase
#                          3.5 implementation notes." No new container is
#                          needed for this: the queue is declared in code
#                          (same idempotent-declare-by-every-caller
#                          pattern as `notifications.email`) against the
#                          same RabbitMQ/Redis already running here.
#
# Postgres is deliberately absent too: this project uses a single shared
# Supabase instance (schema-per-service) rather than a local Postgres
# container, so there's nothing to run locally for the database.
#
# Usage: `make up` / `make down` / `make nuke` from backend/, or directly:
#   docker compose -f docker/docker-compose.infra.yml up -d
services:
  redis:
    image: redis:7-alpine
    container_name: sbp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Single-broker Kafka in KRaft mode (no Zookeeper) — the official
  # apache/kafka image, not Bitnami's (Broadcom moved Bitnami's free
  # versioned tags to the unmaintained bitnamilegacy repo in Aug 2025; see
  # docs/DECISIONS.md's existing "not Bitnami" note for the k8s side of
  # this project — staying consistent here even though that note was
  # originally about Helm charts specifically). One broker, one partition
  # per topic is plenty for local dev; see backend's Kafka topics
  # (user.skills.updated, job.posted, job.matched, skill.updated) —
  # created on first publish (topic auto-creation is left enabled, the
  # broker's default) rather than pre-declared here, since this is a
  # learning project, not a tuned production cluster.
  kafka:
    image: apache/kafka:3.9.0
    container_name: sbp-kafka
    ports:
      - "29092:29092"
    environment:
      # KRaft: this one broker is also the controller (no Zookeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # TWO plaintext listeners (plus the KRaft-only CONTROLLER one) as of
      # Phase 4 — bound on every interface inside the container (bare
      # `:PORT`, not `0.0.0.0:PORT` — the broker's own advertised-listener
      # validation rejects `0.0.0.0` as a "nonroutable meta-address," a
      # gotcha hit during Phase 2's live verification).
      #
      # Phase 2/3/3.5 only ever needed ONE listener, advertised as
      # `localhost:9092`, because every client back then (backend services
      # via `go run`, `kafka-topics.sh` from a shell inside this container)
      # reached the broker from the host's network namespace or from
      # inside this same container — both satisfied by one address.
      #
      # Phase 4 breaks that assumption: skills-service/users-service/
      # jobs-service now also run AS CONTAINERS on this compose network,
      # and need to reach Kafka by its service name (`kafka:9092`), not
      # `localhost:9092` — discovered as a real, live hang during this
      # phase's verification, not anticipated in advance. A container's
      # franz-go client establishes its seed connection to `kafka:9092`
      # fine (Docker DNS resolves the service name), but the broker's
      # first Metadata response — telling the client which address to send
      # the actual Produce request to — said `localhost:9092`, which
      # inside a container resolves to that container itself, not Kafka.
      # `ProduceSync` then blocked forever (bounded only by the caller's
      # own context deadline, if any) retrying against an address nothing
      # is listening on — every `createSkill`/`createJob`/`addUserSkill`
      # call hung indefinitely with no server-side error logged, since the
      # underlying retry loop never itself failed. See docs/DECISIONS.md's
      # Phase 4 notes for the full live diagnosis (confirmed via a direct
      # `grpcurl` call bypassing the gateway entirely, and via the Postgres
      # row landing successfully while the RPC never returned — proving
      # the hang was specifically the post-write Kafka publish, not the
      # write itself).
      #
      # Fix: two listeners, each advertised correctly for its own network
      # namespace — INTERNAL for anything on the compose network
      # (advertised as the service name), EXTERNAL for anything reaching
      # the published host port (advertised as localhost, now on 29092
      # since 9092 is the INTERNAL listener's in-container port and isn't
      # published — a host process, e.g. `go run ./cmd/skills-service`
      # outside Docker, sets KAFKA_BROKERS=localhost:29092, per
      # backend/.env.example).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker: replication/ISR factors of 1 everywhere, same
      # "no broker HA at this scale" reasoning as Redis/RabbitMQ
      # elsewhere in this project (see docs/DECISIONS.md's Scope Cuts).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      # Runs from inside this container, against the INTERNAL listener
      # (still bound on :9092 in-container) — unaffected by the
      # EXTERNAL/INTERNAL advertised-address split above, since this is a
      # direct local connection, not a client resolving a partition
      # leader's address from a Metadata response.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Single-node RabbitMQ, management-plugin image so the management UI
  # (http://localhost:15672, guest/guest — the AMQP default, fine for
  # local-only dev per this project's "no broker HA/hardening at this
  # scale" stance, see docs/DECISIONS.md's Scope Cuts) comes for free —
  # useful for eyeballing `notifications.email` / `notifications.email.dlq`
  # depth while debugging the DLQ flow, rather than only being able to
  # inspect state via rabbitmqadmin. Queue/exchange topology itself
  # (notifications.email, notifications.dlx, notifications.email.dlq) is
  # NOT declared here — it's declared idempotently in code by both
  # auth-service's producer and notification-service's consumer at
  # startup (see internal/platform/rabbitmq/topology.go), the same
  # "created by the app, not pre-provisioned by infra" choice this file
  # already makes for Kafka topics above. Unlike Kafka, RabbitMQ has no
  # advertised-address concept for AMQP — every client (host or
  # containerized) just dials `<host>:5672` directly, so no dual-listener
  # split was needed here for Phase 4.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sbp-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  redis-data:
  kafka-data:
  rabbitmq-data:
