# gqlgen config for api-gateway. Run `make gen` (from backend/) after
# editing graph/schema.graphqls — see backend/CLAUDE.md.
schema:
  - graph/schema.graphqls

exec:
  filename: graph/generated/generated.go
  package: generated

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

# Job, Profile, and UserSkill are bound to hand-written structs in
# graph/model/extra_models.go instead of letting gqlgen generate plain
# ones into models_gen.go. Each needs an extra Go field that isn't a
# GraphQL field at all (e.g. Job.RequiredSkillIDs) so its corresponding
# field resolver (requiredSkills, skills, skill) knows which
# skills-service IDs to resolve — see schema.resolvers.go and
# docs/DECISIONS.md for the deliberate N+1 this drives.
models:
  Job:
    model: github.com/Siddsharma25/skill-bridge-platform/backend/internal/gateway/graph/model.Job
  Profile:
    model: github.com/Siddsharma25/skill-bridge-platform/backend/internal/gateway/graph/model.Profile
  UserSkill:
    model: github.com/Siddsharma25/skill-bridge-platform/backend/internal/gateway/graph/model.UserSkill
