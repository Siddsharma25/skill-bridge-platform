// Package jobs.v1 defines the gRPC contract for jobs-service, which owns
// job postings (jobs.jobs), the skills each posting requires
// (jobs.job_required_skills), and — as of Phase 2 — the matches the
// in-process matching worker produces (jobs.job_matches) plus its own
// event-carried-state-transfer projection of every user's skills
// (jobs.user_skill_snapshot, not exposed over gRPC — it's an internal
// read-model, fed by consuming users-service's user.skills.updated Kafka
// event, never queried directly by a client; see docs/DECISIONS.md's "why
// jobs-service doesn't just query users-service's database").
syntax = "proto3";

package jobs.v1;

option go_package = "github.com/Siddsharma25/skill-bridge-platform/backend/gen/jobs/v1;jobsv1";

// JobsService owns job postings. required_skill_ids reference
// skills-service's Skill IDs by value only — jobs-service cannot read
// skills-service's schema (schema-per-service isolation), so it never
// validates or stores a skill's name/category, just the ID. Resolving
// those IDs to display names is the gateway's job (a deliberate N+1, left
// for Phase 1c's dataloader work per docs/DECISIONS.md).
service JobsService {
  // CreateJob is unauthenticated in Phase 1b, same as CreateSkill — no
  // role system exists yet, so anyone can post a job. See
  // docs/DECISIONS.md.
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);

  // ListJobs returns every job posting, most-recent first. No pagination
  // yet, same reasoning as SkillsService.ListSkills.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // GetJob returns a single job posting by ID, or NotFound.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // ListJobMatches returns every jobs.job_matches row for one job,
  // highest score first — the in-process matching worker's output (see
  // docs/DECISIONS.md's Phase 2 notes), produced entirely from consumed
  // Kafka events (job.posted + the user_skill_snapshot projection fed by
  // user.skills.updated), never a synchronous call to users-service.
  // Added so the Phase 2 checkpoint ("creating a job asynchronously
  // produces queryable match rows") can be demonstrated through the
  // gateway's actual GraphQL API (Job.matches), not just direct SQL.
  rpc ListJobMatches(ListJobMatchesRequest) returns (ListJobMatchesResponse);
}

message Job {
  string id = 1;
  string title = 2;
  string description = 3;
  repeated string required_skill_ids = 4;
}

message CreateJobRequest {
  string title = 1;
  string description = 2;
  repeated string required_skill_ids = 3;
}

message CreateJobResponse {
  Job job = 1;
}

message ListJobsRequest {}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message GetJobRequest {
  string id = 1;
}

message GetJobResponse {
  Job job = 1;
}

// JobMatch is one row of jobs.job_matches — a user the matching worker
// scored against a job's required skills, above the configured threshold
// (see docs/DECISIONS.md for the exact threshold/algorithm chosen).
// user_id is opaque here too, same reasoning as skill_id elsewhere in
// this contract — resolving it to a display name is users-service's data
// via the gateway, not jobs-service's.
message JobMatch {
  string user_id = 1;
  double score = 2;
  string matched_at = 3;
}

message ListJobMatchesRequest {
  string job_id = 1;
}

message ListJobMatchesResponse {
  repeated JobMatch matches = 1;
}
