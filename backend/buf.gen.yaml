version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Siddsharma25/skill-bridge-platform/backend/gen
plugins:
  # Local plugins (not buf.build remote generation) so `make gen` works
  # offline and CI doesn't depend on the BSR being reachable. Install with:
  #   go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
  #   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
