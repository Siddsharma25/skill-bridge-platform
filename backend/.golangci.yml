version: "2"

linters:
  default: standard
  enable:
    - staticcheck
    - errcheck
    - govet
    - revive
    - gosec
  exclusions:
    paths:
      # buf-generated stubs — never hand-edited, not worth linting.
      - "gen/"
      # gqlgen-generated code — same reasoning.
      - "internal/gateway/graph/generated/"
      - "internal/gateway/graph/model/"

formatters:
  enable:
    - gofmt
    - goimports
