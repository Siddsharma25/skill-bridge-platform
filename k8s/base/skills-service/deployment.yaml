apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-service
  namespace: skill-bridge
  labels:
    app: skills-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skills-service
  template:
    metadata:
      labels:
        app: skills-service
    spec:
      containers:
        - name: skills-service
          image: skill-bridge/skills-service:kind
          imagePullPolicy: Never
          ports:
            - name: grpc
              containerPort: 9002
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: skills-service-config
            - secretRef:
                name: skills-service-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
