# Illustrative shape only — see k8s/base/auth-service/secret.example.yaml
# for the full explanation of this convention (never applied directly,
# not listed in kustomization.yaml, real Secret created imperatively at
# deploy time). skills-service only needs its own scoped DB role.
apiVersion: v1
kind: Secret
metadata:
  name: skills-service-secrets
  namespace: skill-bridge
type: Opaque
stringData:
  DATABASE_URL: "postgres://skills_service:CHANGE_ME@postgres.skill-bridge.svc.cluster.local:5432/postgres"
