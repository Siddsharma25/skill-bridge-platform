# Illustrative shape only — never apply this file directly and never fill
# in real values here. Matches the project's existing secrets convention
# (see docs/DECISIONS.md's Secrets Management section and
# backend/.env.example): commit a `secret.example.yaml` showing the
# shape, generate the real Secret imperatively at deploy time via
# `kubectl create secret generic auth-service-secrets
# --from-env-file=<uncommitted file> -n skill-bridge`, and never commit
# the file with real values. This file is intentionally NOT listed in
# k8s/base/kustomization.yaml's resources, so `kubectl apply -k` never
# touches it.
#
# DATABASE_URL: for this kind sandbox, the throwaway in-cluster Postgres
# (see the Phase 5 verification notes in docs/DECISIONS.md — that
# Postgres manifest is deliberately NOT committed anywhere in this repo)
# using the auth_service role created by migrations/000_bootstrap.sql,
# e.g. postgres://auth_service:<password>@postgres.skill-bridge.svc.cluster.local:5432/postgres
# Against real Supabase this would instead be the Supavisor pooler DSN —
# see backend/.env.example.
#
# JWT_PRIVATE_KEY_PEM: a real RS256 keypair generated for this kind
# session (openssl genrsa), NOT the ephemeral per-process key
# auth-service falls back to when this is unset — with a single replica
# and a proper Secret, tokens now survive a pod restart, which is worth
# proving in a k8s-shaped environment even though it doesn't matter for a
# single local `go run`. See docs/DECISIONS.md's Phase 5 implementation
# notes.
#
# RABBITMQ_URL: amqp://appuser:<password>@skill-bridge.rabbitmq.svc.cluster.local:5672/
# — the fixed default_user/default_pass pinned in
# k8s/rabbitmq/rabbitmq-cluster.yaml's additionalConfig (see that file's
# comment for why the operator's auto-generated credentials Secret isn't
# used directly).
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: skill-bridge
type: Opaque
stringData:
  DATABASE_URL: "postgres://auth_service:CHANGE_ME@postgres.skill-bridge.svc.cluster.local:5432/postgres"
  JWT_PRIVATE_KEY_PEM: "-----BEGIN PRIVATE KEY-----\nCHANGE_ME\n-----END PRIVATE KEY-----"
  RABBITMQ_URL: "amqp://appuser:CHANGE_ME@skill-bridge.rabbitmq.svc.cluster.local:5672/"
