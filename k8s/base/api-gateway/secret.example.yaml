# Illustrative shape only — see k8s/base/auth-service/secret.example.yaml
# for the full explanation of this convention. api-gateway is stateless
# (no schema of its own, no DATABASE_URL) but consumes
# notifications.realtime off RabbitMQ and republishes onto Redis pub/sub
# (see internal/gateway/realtime, Phase 3.5), so it needs RABBITMQ_URL.
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: skill-bridge
type: Opaque
stringData:
  RABBITMQ_URL: "amqp://appuser:CHANGE_ME@skill-bridge.rabbitmq.svc.cluster.local:5672/"
