# Illustrative shape only — see k8s/base/auth-service/secret.example.yaml
# for the full explanation of this convention. jobs-service is the one
# other service besides auth-service that publishes to RabbitMQ
# (notifications.realtime on job.matched — see internal/jobs/matcher.go),
# so it needs RABBITMQ_URL too, not just DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: jobs-service-secrets
  namespace: skill-bridge
type: Opaque
stringData:
  DATABASE_URL: "postgres://jobs_service:CHANGE_ME@postgres.skill-bridge.svc.cluster.local:5432/postgres"
  RABBITMQ_URL: "amqp://appuser:CHANGE_ME@skill-bridge.rabbitmq.svc.cluster.local:5672/"
